name: Publish

# Publishing a GitHub release uploads that tag to PyPI. To publish a release
# made before this workflow existed, run it by hand and name the tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, such as v0.1.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  build:
    name: Build the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Check the version matches the tag
        run: |
          wheel="dist/gridql-${TAG#v}-py3-none-any.whl"
          if [ ! -f "$wheel" ]; then
            echo "::error::Tag $TAG does not match the package version; built $(ls dist)"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gridql/
    permissions:
      id-token: write  # trusted publishing: PyPI accepts this workflow's identity, no token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
